# Builds every plugin in plugins.toml from the commit it is pinned to and checks it with wisp; on
# main, publishes them as the one release wisp reads (index.toml and each <id>.wasm).
name: list

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: list-${{ github.ref }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build and check every listed plugin
        run: python3 scripts/build.py --out dist --notes notes.md --release "$(date -u +%Y-%m-%d).${{ github.run_number }}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: list
          path: |
            dist
            notes.md
          if-no-files-found: error

  publish:
    # Only what was merged into main, and no plugin's build runs in the job that may write.
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: list
      - name: Publish the release wisp reads
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          release=$(python3 -c 'import tomllib; print(tomllib.load(open("dist/index.toml", "rb"))["release"])')
          gh release create "$release" dist/* --title "The wisp list $release" --notes-file notes.md --latest
